<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Basic Scene Example</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; background-color: #0b0c10; font-family: sans-serif; }
    #webgl-canvas { width: 100%; height: 100%; display: block; }
    .ui-overlay {
      position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10;
      pointer-events: none; background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px); padding: 1rem 1.5rem; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>
  <div class="ui-overlay">
    <h2>3D Interactive Canvas</h2>
    <p>Drag to rotate | Scroll to zoom</p>
  </div>
  <canvas id="webgl-canvas"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
